<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #camerafeed, #unity-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    #camerafeed { z-index: 0; }
    #unity-canvas { z-index: 1; background: transparent; touch-action: none; }
    #status, #debug { z-index: 2; }
    #status { position: fixed; left: 16px; right: 16px; bottom: 12%; text-align: center; color: #fff; pointer-events: none;
              font: 600 17px/1.4 system-ui, -apple-system, sans-serif; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
    #debug { position: fixed; top: 8px; left: 8px; margin: 0; color: #fff; font: 11px/1.3 monospace; pointer-events: none;
             text-shadow: 0 1px 3px #000; white-space: pre-wrap; }
  </style>
  <!-- 8th Wall open-source engine (MIT): camera, image target detection and tracking. "slam" = XrController chunk. -->
  <script src="xr/xr.js" data-preload-chunks="slam"></script>
</head>
<body>
  <canvas id="camerafeed"></canvas>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="status">Carregando…</div>
  <pre id="debug"></pre>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script type="module">
    import { toCardPose } from './freewebar.js';

    const TARGETS = ['image-targets/pucmon.json'];  // made with: npx @8thwall/image-target-cli
    const HINT = 'Aponte a câmera para a imagem';
    const q = new URLSearchParams(location.search);
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    const debug = document.getElementById('debug');
    // [tracked, position xyz, forward xyz, up xyz, projection (16, column-major GL)] in Unity camera space.
    // FreeWebAR.jslib copies it into WebARImageTracker every frame.
    const pose = window.freeWebARPose = new Float32Array(26);
    let unityReady = false, cameraReady = false, cameraLabel = '';
    const showHint = () => { if (unityReady && cameraReady) status.textContent = pose[0] ? '' : HINT; };
    const fail = message => { status.textContent = message; };

    const unityBridge = {
      name: 'unity-bridge',
      onCameraStatusChange: ({ status: s, stream, video }) => {
        if (stream) cameraLabel = stream.getVideoTracks()[0]?.label || '';
        if (s === 'hasVideo') { cameraReady = true; if (video) cameraLabel += ` ${video.videoWidth}x${video.videoHeight}`; showHint(); }
        if (s === 'failed') fail('Permita o acesso à câmera e recarregue a página.');
      },
      onUpdate: ({ processCpuResult }) => {
        const r = processCpuResult.reality;
        if (!r) return;
        pose.set(r.intrinsics, 10);
        // The engine's far plane is infinite; give Unity a finite one (card units) so culling and depth behave.
        const near = 0.05, far = 1000;
        pose[20] = -(far + near) / (far - near);
        pose[24] = -2 * far * near / (far - near);
        const image = r.detectedImages?.[0];
        pose[0] = image ? 1 : 0;
        if (image) pose.set(toCardPose(r, image), 1);
        showHint();
        if (q.has('debug')) debug.textContent = `${cameraLabel}\n${image ? 'rastreando' : 'procurando'}`;
      },
      onException: e => { console.error(e); fail(String(e.message || e)); },
    };

    // Camera feed canvas at the screen's resolution (up to 2x). The engine's FullWindowCanvas module would use 1x,
    // which looks soft on phones, and moves the canvas above Unity's.
    const feed = document.getElementById('camerafeed');
    const sizeFeed = () => {
      const dpr = Math.min(window.devicePixelRatio, 2);
      feed.width = Math.round(innerWidth * dpr);
      feed.height = Math.round(innerHeight * dpr);
    };
    sizeFeed();
    addEventListener('resize', sizeFeed);

    async function startAR() {
      const imageTargetData = await Promise.all(TARGETS.map(url => fetch(url).then(r => r.json())));
      // No world tracking: the card is tracked from the image alone, never "slides" onto world anchors.
      XR8.XrController.configure({ disableWorldTracking: true, leftHandedAxes: true, imageTargetData });
      XR8.addCameraPipelineModules([
        XR8.GlTextureRenderer.pipelineModule(),  // draws the camera behind the transparent Unity canvas
        XR8.XrController.pipelineModule(),
        unityBridge,
      ]);
      XR8.run({ canvas: feed, allowedDevices: XR8.XrConfig.device().ANY });
    }
    if (!window.isSecureContext) fail('A câmera só funciona em HTTPS.');
    else if (window.XR8) startAR();
    else window.addEventListener('xrloaded', startAR);

    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio, 2),
      webglContextAttributes: { premultipliedAlpha: true, preserveDrawingBuffer: false, powerPreference: 2 },  // 2 = high-performance
    }, progress => { if (!unityReady) status.textContent = `Carregando ${Math.round(progress * 100)}%`; })
      .then(() => { unityReady = true; status.textContent = ''; showHint(); })
      .catch(e => { console.error(e); fail(String(e.message || e)); });
  </script>
</body>
</html>
