<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #camera, #unity-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    #camera { object-fit: cover; }
    #unity-canvas { background: transparent; touch-action: none; }
    #status { position: fixed; left: 16px; right: 16px; bottom: 12%; text-align: center; color: #fff; pointer-events: none;
              font: 600 17px/1.4 system-ui, -apple-system, sans-serif; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
    #debug { position: fixed; top: 8px; left: 8px; margin: 0; color: #fff; font: 11px/1.3 monospace; pointer-events: none;
             text-shadow: 0 1px 3px #000; white-space: pre-wrap; }
  </style>
</head>
<body>
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="status">Carregando…</div>
  <pre id="debug"></pre>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script type="module">
    import './mindar/mindar-image.prod.js';
    import { toUnityPose, displayFovY, PoseFilter, FILTER_DEFAULTS, mainBackCamera } from './freewebar.js';

    // Tuning knobs. Override on the phone to compare, e.g. ?tmin=0.3&debug
    const q = new URLSearchParams(location.search);
    const num = (key, fallback) => q.has(key) ? Number(q.get(key)) : fallback;
    const TRACK_SIZE = num('track', 640);  // long side (px) of the frame MindAR analyses; the camera is still shown in HD
    const LENS_FOV = num('fov', 60);       // assumed camera FOV (degrees) across the image's long side; phones are ~60-70
    const KEYFRAME = num('kf', 0);         // target resolution MindAR tracks against: 0 = 256 px, 1 = 128 px (MindAR's default)
    const MINDAR_OPTIONS = {
      filterMinCF: 1e6,                    // MindAR's own filter off (passes through); PoseFilter below smooths instead
      warmupTolerance: num('warmup', 5),   // frames before showing a newly found target
      missTolerance: num('miss', 5),       // frames a lost target stays visible
    };
    // Per channel [cutoff Hz at rest, beta]: ?pmin/pbeta (position), ?tmin/tbeta (tilt), ?rmin/rbeta (in-plane roll).
    // Lower cutoff = steadier at rest, higher beta = less lag in motion.
    const knob = (p, [min, beta]) => [num(p + 'min', min), num(p + 'beta', beta)];
    const filter = new PoseFilter({
      pos: knob('p', FILTER_DEFAULTS.pos), tilt: knob('t', FILTER_DEFAULTS.tilt), roll: knob('r', FILTER_DEFAULTS.roll),
    });
    const HINT = 'Aponte a câmera para a imagem';

    const video = document.getElementById('camera');
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    // [tracked, fovY, position xyz, forward xyz, up xyz] in Unity camera space. FreeWebAR.jslib reads it every frame.
    const pose = window.freeWebARPose = new Float32Array(11);
    let controller, marker, unityReady = false;

    function fitTrackSize() {
      const s = Math.min(1, TRACK_SIZE / Math.max(video.videoWidth, video.videoHeight));
      return [Math.round(video.videoWidth * s), Math.round(video.videoHeight * s)];
    }

    function onUpdate({ type, worldMatrix }, from) {
      if (type !== 'updateMatrix' || from !== controller) return;  // ignore a disposed controller's last frame
      pose[0] = worldMatrix ? 1 : 0;
      if (worldMatrix) {
        const tanHalfFovY = 1 / controller.getProjectionMatrix()[5];
        pose[1] = displayFovY(tanHalfFovY, video.videoWidth, video.videoHeight, canvas.clientWidth, canvas.clientHeight);
        pose.set(filter.filter(performance.now() / 1000, toUnityPose(worldMatrix, marker[0], marker[1])), 2);
      } else {
        filter.reset();  // start fresh when found again instead of gliding from the old pose
      }
      if (unityReady) status.textContent = worldMatrix ? '' : HINT;
    }

    // MindAR's tracker matches in whole pixels of a 128 px keyframe of the target (TRACKING_KEYFRAME = 1), so each
    // point snaps in 1/128 steps of the target: the main source of jitter. The .mind also has a 256 px keyframe with
    // more points; put it in the slot the tracker reads.
    function withTrackingKeyframe(buffer, k) {
      const compiler = new MINDAR.IMAGE.Compiler();
      for (const d of compiler.importData(buffer)) d.trackingData = [d.trackingData[k], d.trackingData[k]];
      return compiler.exportData();
    }

    function startTracker(targets) {
      controller?.dispose();
      // MindAR draws the <video> at its width/height attributes, which downsamples the HD feed for tracking.
      [video.width, video.height] = fitTrackSize();
      const c = controller = new MINDAR.IMAGE.Controller({
        inputWidth: video.width, inputHeight: video.height, maxTrack: 1, onUpdate: data => onUpdate(data, c), ...MINDAR_OPTIONS,
      });
      // MindAR assumes a 45° FOV on whichever axis is vertical, so the lens "changes" when the phone rotates.
      // Pin it to the long side instead; must happen before addImageTargets* hands it to the tracker and worker.
      const f = Math.max(video.width, video.height) / 2 / Math.tan(LENS_FOV * Math.PI / 360);
      c.projectionTransform = [[f, 0, video.width / 2], [0, f, video.height / 2], [0, 0, 1]];
      c.projectionMatrix = c._glProjectionMatrix({
        projectionTransform: c.projectionTransform, width: video.width, height: video.height, near: 10, far: 100000,
      });
      marker = controller.addImageTargetsFromBuffer(targets).dimensions[0];
      controller.dummyRun(video);
      controller.processVideo(video);
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('A câmera só funciona em HTTPS, no navegador do celular.');
      const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
      let stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'environment', ...size } });
      // Labels are only readable once permission is granted, so choose the lens after the first stream.
      // ?cam=N forces the Nth camera of the list shown with ?debug.
      const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      const main = q.has('cam') ? cams[num('cam', 0)] : mainBackCamera(cams);
      if (main && main.deviceId !== stream.getVideoTracks()[0].getSettings().deviceId) {
        stream.getTracks().forEach(t => t.stop());
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { deviceId: { exact: main.deviceId }, ...size } });
      }
      video.srcObject = stream;
      await video.play();
      if (!video.videoWidth) await new Promise(r => video.addEventListener('loadedmetadata', r, { once: true }));
      if (q.has('debug')) {
        const open = stream.getVideoTracks()[0].label;
        document.getElementById('debug').textContent =
          cams.map((c, i) => `${c.label === open ? '▶' : ' '} ${i}: ${c.label}`).join('\n') + `\n${video.videoWidth}x${video.videoHeight}`;
      }
    }

    const unity = createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio, 2),
      webglContextAttributes: { premultipliedAlpha: true, preserveDrawingBuffer: false, powerPreference: 2 },  // 2 = high-performance
    }, progress => { if (!unityReady) status.textContent = `Carregando ${Math.round(progress * 100)}%`; });

    try {
      const [targets] = await Promise.all([
        fetch('targets.mind').then(r => r.arrayBuffer()).then(b => withTrackingKeyframe(b, KEYFRAME)),
        startCamera(),
      ]);
      startTracker(targets);
      // Phone rotated (or camera changed resolution): MindAR's own rotated-input path returns poses turned 90°
      // and stops re-detecting, so start a controller sized for the new frame instead.
      // ponytail: MindAR never frees the old controller's GPU textures (a few MB per rotation); fine for a session.
      video.addEventListener('resize', () => {
        const [w, h] = fitTrackSize();
        if (w !== controller.inputWidth || h !== controller.inputHeight) startTracker(targets);
      });
      await unity;
      unityReady = true;
      if (!pose[0]) status.textContent = HINT;
    } catch (e) {
      console.error(e);
      status.textContent = e.name === 'NotAllowedError'
        ? 'Permita o acesso à câmera e recarregue a página.'
        : e.message || String(e);
    }
  </script>
</body>
</html>
